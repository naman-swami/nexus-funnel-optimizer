annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Calculate conversion propensity score based on firmographic and behavioral
  attributes.
input_schema:
  additionalProperties: false
  properties:
    company_domain:
      type: string
    employee_count:
      type: number
    tech_stack:
      type: string
    web_events:
      type: string
  required:
  - company_domain
  - employee_count
  type: object
name: score-lead-propensity
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
