annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Calculate renewal risk score and contract expansion probability.
input_schema:
  additionalProperties: false
  properties:
    seat_utilization:
      type: number
    ticket_volume:
      type: number
    usage_metrics:
      type: string
  required:
  - usage_metrics
  - seat_utilization
  type: object
name: model-churn-hazard
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
